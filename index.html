<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>消消乐游戏</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="home-page" class="page active">
        <div class="header">
            <div class="user-info">
                <div class="avatar">🎮</div>
                <div class="user-details">
                    <div class="username" id="username">玩家</div>
                    <div class="level-info">
                        <span class="coins">💰 <span id="coins">100</span></span>
                        <span class="stars">⭐ <span id="total-stars">0</span></span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="game-title">消消乐</div>
        
        <div class="level-grid" id="level-grid">
            <!-- 关卡按钮将通过JavaScript动态生成 -->
        </div>
        
        <div class="footer">
            <div class="shop-btn" id="shop-btn">
                <span class="shop-icon">🛒</span>
                <span>商店</span>
            </div>
        </div>
    </div>

    <div id="game-page" class="page">
        <div class="game-header">
            <button class="back-btn" id="back-btn">← 返回</button>
            <div class="game-info">
                <div class="current-level">第 <span id="current-level-num">1</span> 关</div>
                <div class="moves-info">
                    <span>剩余步数: </span>
                    <span id="moves-left" class="moves-count">20</span>
                </div>
            </div>
        </div>

        <div class="goal-info" id="goal-info">
            <span>目标: </span>
            <span id="goal-text">消除所有图案</span>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="score-info">
                <span>得分: <span id="score">0</span></span>
            </div>
        </div>

        <div class="tools-container">
            <div class="tool-item" id="tool-swap" title="交换位置">
                <div class="tool-icon">🔄</div>
                <div class="tool-count" id="swap-count">3</div>
            </div>
            <div class="tool-item" id="tool-row" title="消除一行">
                <div class="tool-icon">➖</div>
                <div class="tool-count" id="row-count">2</div>
            </div>
            <div class="tool-item" id="tool-magic" title="消除魔棒">
                <div class="tool-icon">✨</div>
                <div class="tool-count" id="magic-count">1</div>
            </div>
        </div>

        <div class="game-board-container">
            <div class="game-board" id="game-board">
                <!-- 棋盘将通过JavaScript动态生成 -->
            </div>
        </div>

        <div class="hint-overlay" id="hint-overlay">
            <div class="hint-message">
                <div class="hint-text">💡 提示：交换相邻的相同图案来消除它们！</div>
                <div class="hint-arrow">👆</div>
            </div>
        </div>
    </div>

    <div id="result-modal" class="modal">
        <div class="modal-content">
            <div class="result-icon" id="result-icon">🎉</div>
            <div class="result-title" id="result-title">恭喜过关！</div>
            <div class="result-stars" id="result-stars">⭐⭐⭐</div>
            <div class="result-info" id="result-info">得分: 1000</div>
            <div class="result-buttons">
                <button class="btn btn-secondary" id="retry-btn">重玩</button>
                <button class="btn btn-primary" id="next-level-btn">下一关</button>
            </div>
        </div>
    </div>

    <div id="shop-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">道具商店</div>
            <div class="shop-items">
                <div class="shop-item" data-item="swap">
                    <div class="shop-icon">🔄</div>
                    <div class="shop-name">交换卡</div>
                    <div class="shop-price">💰 10</div>
                    <button class="btn btn-small btn-buy" data-item="swap">购买</button>
                </div>
                <div class="shop-item" data-item="row">
                    <div class="shop-icon">➖</div>
                    <div class="shop-name">消除行</div>
                    <div class="shop-price">💰 20</div>
                    <button class="btn btn-small btn-buy" data-item="row">购买</button>
                </div>
                <div class="shop-item" data-item="magic">
                    <div class="shop-icon">✨</div>
                    <div class="shop-name">消除魔棒</div>
                    <div class="shop-price">💰 30</div>
                    <button class="btn btn-small btn-buy" data-item="magic">购买</button>
                </div>
            </div>
            <button class="btn btn-secondary" id="close-shop-btn">关闭</button>
        </div>
    </div>

    <script src="js/levels.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
